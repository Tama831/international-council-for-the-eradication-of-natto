<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="第四条 倫理的混乱">
  <rect width="200" height="200" fill="#F2EAD8"/>
  <!-- balance scale (tilted) -->
  <g stroke="#1F1813" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- post -->
    <line x1="100" y1="50" x2="100" y2="150"/>
    <!-- base -->
    <line x1="70" y1="155" x2="130" y2="155"/>
    <line x1="80" y1="160" x2="120" y2="160"/>
    <!-- tilted beam -->
    <line x1="40" y1="65" x2="160" y2="80"/>
  </g>
  <!-- left pan (low) — 発酵 -->
  <g stroke="#1F1813" stroke-width="2" fill="none">
    <line x1="40" y1="65" x2="30" y2="105"/>
    <line x1="40" y1="65" x2="50" y2="105"/>
    <path d="M 22 105 Q 40 120 58 105"/>
  </g>
  <!-- right pan (high) — 腐敗 -->
  <g stroke="#1F1813" stroke-width="2" fill="none">
    <line x1="160" y1="80" x2="150" y2="60"/>
    <line x1="160" y1="80" x2="170" y2="60"/>
    <path d="M 142 60 Q 160 75 178 60"/>
  </g>
  <!-- labels -->
  <g font-family="serif" font-size="11" font-weight="700" fill="#1F1813">
    <text x="22" y="125" text-anchor="start">発酵</text>
    <text x="178" y="50" text-anchor="end">腐敗</text>
  </g>
  <!-- question mark in middle -->
  <text x="100" y="38" text-anchor="middle" font-family="serif" font-size="28" font-weight="800" fill="#8B1A1A">?</text>
  <!-- big diagonal X overlay -->
  <g stroke="#8B1A1A" stroke-width="10" stroke-linecap="square" opacity="0.92">
    <line x1="40" y1="40" x2="160" y2="160"/>
    <line x1="160" y1="40" x2="40" y2="160"/>
  </g>
  <text x="14" y="190" font-family="serif" font-style="italic" font-size="22" font-weight="700" fill="#8B1A1A">IV.</text>
</svg>
