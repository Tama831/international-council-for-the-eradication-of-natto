<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="第一条 視覚的暴力">
  <rect width="200" height="200" fill="#F2EAD8"/>
  <!-- eye shape -->
  <g fill="none" stroke="#1F1813" stroke-width="3" stroke-linecap="round">
    <path d="M 30 100 Q 100 50 170 100 Q 100 150 30 100 Z"/>
    <circle cx="100" cy="100" r="22" fill="#1F1813"/>
    <circle cx="106" cy="93" r="6" fill="#F2EAD8"/>
    <!-- eyebrow -->
    <path d="M 50 60 Q 100 45 150 60" stroke-width="5"/>
  </g>
  <!-- impact / startle marks -->
  <g stroke="#8B1A1A" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="30" x2="40" y2="50"/>
    <line x1="180" y1="30" x2="160" y2="50"/>
    <line x1="20" y1="170" x2="40" y2="150"/>
    <line x1="180" y1="170" x2="160" y2="150"/>
  </g>
  <!-- big diagonal X overlay -->
  <g stroke="#8B1A1A" stroke-width="10" stroke-linecap="square" opacity="0.92">
    <line x1="40" y1="40" x2="160" y2="160"/>
    <line x1="160" y1="40" x2="40" y2="160"/>
  </g>
  <!-- roman numeral -->
  <text x="14" y="190" font-family="serif" font-style="italic" font-size="22" font-weight="700" fill="#8B1A1A">I.</text>
</svg>
