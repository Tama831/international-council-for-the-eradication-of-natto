<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="第五条 社会的分断">
  <rect width="200" height="200" fill="#F2EAD8"/>
  <!-- table -->
  <g stroke="#1F1813" stroke-width="3" fill="none">
    <rect x="30" y="120" width="140" height="14" stroke-linejoin="round"/>
    <line x1="40" y1="134" x2="40" y2="160"/>
    <line x1="160" y1="134" x2="160" y2="160"/>
  </g>
  <!-- jagged crack splitting the table -->
  <g stroke="#8B1A1A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="100,120 95,124 105,128 96,132 102,134"/>
  </g>
  <!-- left figure (silhouette) -->
  <g fill="#1F1813">
    <circle cx="55" cy="65" r="14"/>
    <path d="M 35 110 Q 55 80 75 110 Z"/>
  </g>
  <!-- right figure (silhouette, slightly turned away) -->
  <g fill="#1F1813">
    <circle cx="145" cy="65" r="14"/>
    <path d="M 125 110 Q 145 80 165 110 Z"/>
  </g>
  <!-- arrow of distance -->
  <g stroke="#8B1A1A" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 80 60 L 120 60"/>
    <path d="M 80 60 L 86 56"/>
    <path d="M 80 60 L 86 64"/>
    <path d="M 120 60 L 114 56"/>
    <path d="M 120 60 L 114 64"/>
  </g>
  <!-- big diagonal X overlay -->
  <g stroke="#8B1A1A" stroke-width="10" stroke-linecap="square" opacity="0.92">
    <line x1="40" y1="40" x2="160" y2="160"/>
    <line x1="160" y1="40" x2="40" y2="160"/>
  </g>
  <text x="14" y="190" font-family="serif" font-style="italic" font-size="22" font-weight="700" fill="#8B1A1A">V.</text>
</svg>
