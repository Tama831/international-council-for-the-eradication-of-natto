<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="第二条 嗅覚的侵略">
  <rect width="200" height="200" fill="#F2EAD8"/>
  <!-- nose / face profile -->
  <g fill="none" stroke="#1F1813" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 105 50 Q 100 80 110 110 Q 120 130 105 142 Q 90 145 88 130"/>
    <path d="M 96 132 Q 102 138 110 134"/>
  </g>
  <!-- radiating smell waves (concentric arcs) -->
  <g fill="none" stroke="#8B1A1A" stroke-width="2.5" stroke-linecap="round" opacity="0.88">
    <path d="M 30 60 Q 50 80 30 100"/>
    <path d="M 22 50 Q 50 80 22 110"/>
    <path d="M 14 40 Q 50 80 14 120"/>
    <path d="M 30 130 Q 50 145 30 160"/>
    <path d="M 22 125 Q 50 150 22 175"/>
  </g>
  <!-- pulse dots -->
  <g fill="#8B1A1A">
    <circle cx="50" cy="80" r="3"/>
    <circle cx="50" cy="150" r="3"/>
  </g>
  <!-- big diagonal X overlay -->
  <g stroke="#8B1A1A" stroke-width="10" stroke-linecap="square" opacity="0.92">
    <line x1="40" y1="40" x2="160" y2="160"/>
    <line x1="160" y1="40" x2="40" y2="160"/>
  </g>
  <text x="14" y="190" font-family="serif" font-style="italic" font-size="22" font-weight="700" fill="#8B1A1A">II.</text>
</svg>
