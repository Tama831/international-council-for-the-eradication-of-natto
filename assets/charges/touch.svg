<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="第三条 触覚的拘束">
  <rect width="200" height="200" fill="#F2EAD8"/>
  <!-- chopsticks crossing -->
  <g stroke="#5a3d1f" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="30" x2="120" y2="120"/>
    <line x1="55" y1="25" x2="135" y2="115"/>
  </g>
  <!-- sticky strings dripping in tangles -->
  <g fill="none" stroke="#9a7a4e" stroke-width="2" stroke-linecap="round">
    <path d="M 122 120 Q 140 140 130 165"/>
    <path d="M 125 125 Q 155 145 145 175"/>
    <path d="M 128 122 Q 110 150 115 180"/>
    <path d="M 130 118 Q 165 160 150 185"/>
    <path d="M 118 122 Q 90 145 100 170"/>
  </g>
  <!-- bean cluster at the end -->
  <g fill="#7d5230" stroke="#3d2715" stroke-width="0.8">
    <ellipse cx="125" cy="118" rx="9" ry="6" transform="rotate(40 125 118)"/>
    <ellipse cx="115" cy="122" rx="8" ry="5" transform="rotate(-25 115 122)"/>
    <ellipse cx="135" cy="120" rx="9" ry="6" transform="rotate(15 135 120)"/>
  </g>
  <!-- big diagonal X overlay -->
  <g stroke="#8B1A1A" stroke-width="10" stroke-linecap="square" opacity="0.92">
    <line x1="40" y1="40" x2="160" y2="160"/>
    <line x1="160" y1="40" x2="40" y2="160"/>
  </g>
  <text x="14" y="190" font-family="serif" font-style="italic" font-size="22" font-weight="700" fill="#8B1A1A">III.</text>
</svg>
