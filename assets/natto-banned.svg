<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="納豆 — 撲滅対象">
  <defs>
    <radialGradient id="paper" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#F4ECDB"/>
      <stop offset="100%" stop-color="#E0D2B4"/>
    </radialGradient>
    <radialGradient id="bowlIn" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#4a3a2c"/>
      <stop offset="100%" stop-color="#1c140d"/>
    </radialGradient>
    <linearGradient id="bowlOut" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2d2117"/>
      <stop offset="100%" stop-color="#1a120c"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0.18 0"/>
    </filter>
  </defs>

  <!-- aged paper background -->
  <rect width="720" height="480" fill="url(#paper)"/>
  <rect width="720" height="480" filter="url(#grain)" opacity="0.5"/>

  <!-- corner stamp text -->
  <g font-family="serif" fill="#8B1A1A" font-weight="800" letter-spacing="6">
    <text x="40" y="50" font-size="13">撲滅対象 · OBJECTUM ABOLENDUM</text>
    <text x="40" y="70" font-size="11" opacity="0.7">REF. ICEN/OBJ/2026/Q2/001</text>
  </g>

  <!-- ─── Bowl ─── -->
  <ellipse cx="360" cy="370" rx="240" ry="22" fill="#000" opacity="0.32"/>
  <path d="M 130 340 Q 130 425 360 425 Q 590 425 590 340 Z" fill="url(#bowlOut)"/>
  <ellipse cx="360" cy="340" rx="230" ry="60" fill="url(#bowlIn)"/>
  <ellipse cx="360" cy="338" rx="222" ry="50" fill="none" stroke="#5a4a38" stroke-width="1.2" opacity="0.5"/>

  <!-- chopsticks behind -->
  <g stroke="#7a5a32" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="500" y1="100" x2="660" y2="240"/>
    <line x1="520" y1="90" x2="680" y2="230"/>
  </g>

  <!-- ─── Natto beans (clusters) ─── -->
  <g fill="#7d5230" stroke="#3d2715" stroke-width="0.7">
    <!-- back row -->
    <ellipse cx="200" cy="305" rx="13" ry="9" transform="rotate(-22 200 305)"/>
    <ellipse cx="225" cy="302" rx="14" ry="10" transform="rotate(8 225 302)"/>
    <ellipse cx="252" cy="300" rx="13" ry="9" transform="rotate(-15 252 300)"/>
    <ellipse cx="280" cy="298" rx="14" ry="10" transform="rotate(28 280 298)"/>
    <ellipse cx="308" cy="296" rx="13" ry="9" transform="rotate(-8 308 296)"/>
    <ellipse cx="336" cy="298" rx="14" ry="10" transform="rotate(40 336 298)"/>
    <ellipse cx="365" cy="296" rx="13" ry="9" transform="rotate(-30 365 296)"/>
    <ellipse cx="392" cy="298" rx="14" ry="10" transform="rotate(15 392 298)"/>
    <ellipse cx="420" cy="300" rx="13" ry="9" transform="rotate(-12 420 300)"/>
    <ellipse cx="448" cy="302" rx="14" ry="10" transform="rotate(35 448 302)"/>
    <ellipse cx="476" cy="305" rx="13" ry="9" transform="rotate(-20 476 305)"/>
    <ellipse cx="504" cy="308" rx="13" ry="9" transform="rotate(10 504 308)"/>
    <!-- middle row (raised) -->
    <ellipse cx="220" cy="320" rx="14" ry="10" transform="rotate(20 220 320)"/>
    <ellipse cx="252" cy="322" rx="14" ry="10" transform="rotate(-30 252 322)"/>
    <ellipse cx="288" cy="322" rx="15" ry="10" transform="rotate(12 288 322)"/>
    <ellipse cx="324" cy="320" rx="14" ry="10" transform="rotate(-15 324 320)"/>
    <ellipse cx="362" cy="318" rx="15" ry="11" transform="rotate(38 362 318)"/>
    <ellipse cx="400" cy="320" rx="14" ry="10" transform="rotate(-25 400 320)"/>
    <ellipse cx="438" cy="322" rx="14" ry="10" transform="rotate(20 438 322)"/>
    <ellipse cx="475" cy="320" rx="14" ry="10" transform="rotate(-8 475 320)"/>
    <ellipse cx="510" cy="320" rx="14" ry="10" transform="rotate(28 510 320)"/>
    <!-- front row (closest, lighter) -->
    <ellipse cx="240" cy="338" rx="15" ry="11" transform="rotate(-10 240 338)" fill="#8a5e3a"/>
    <ellipse cx="280" cy="342" rx="16" ry="11" transform="rotate(20 280 342)" fill="#8a5e3a"/>
    <ellipse cx="322" cy="345" rx="16" ry="11" transform="rotate(-25 322 345)" fill="#8a5e3a"/>
    <ellipse cx="365" cy="346" rx="17" ry="12" transform="rotate(15 365 346)" fill="#8a5e3a"/>
    <ellipse cx="408" cy="345" rx="16" ry="11" transform="rotate(-15 408 345)" fill="#8a5e3a"/>
    <ellipse cx="450" cy="342" rx="16" ry="11" transform="rotate(30 450 342)" fill="#8a5e3a"/>
    <ellipse cx="490" cy="338" rx="15" ry="11" transform="rotate(-12 490 338)" fill="#8a5e3a"/>
  </g>

  <!-- ─── Strings (粘り) ─── -->
  <g stroke="#9a7a4e" stroke-width="1.3" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 240 290 Q 280 245 320 295"/>
    <path d="M 320 295 Q 360 250 400 290"/>
    <path d="M 400 290 Q 440 248 480 295"/>
    <path d="M 260 305 Q 290 270 320 308"/>
    <path d="M 360 305 Q 400 268 440 305"/>
    <path d="M 220 318 Q 240 300 260 322"/>
    <path d="M 470 318 Q 490 300 510 322"/>
    <!-- vertical drip -->
    <path d="M 360 310 Q 365 250 358 200"/>
    <path d="M 320 305 Q 314 245 310 195"/>
  </g>

  <!-- ─── The Big X (oxblood) ─── -->
  <g stroke="#8B1A1A" stroke-width="34" stroke-linecap="square" opacity="0.95">
    <line x1="160" y1="120" x2="560" y2="420" transform="rotate(-2 360 270)"/>
    <line x1="560" y1="120" x2="160" y2="420" transform="rotate(-2 360 270)"/>
  </g>
  <!-- thin black inner outline for stamp feel -->
  <g stroke="#3a0808" stroke-width="2" fill="none" opacity="0.7">
    <line x1="160" y1="120" x2="560" y2="420" transform="rotate(-2 360 270)"/>
    <line x1="560" y1="120" x2="160" y2="420" transform="rotate(-2 360 270)"/>
  </g>

  <!-- thin border -->
  <rect x="6" y="6" width="708" height="468" fill="none" stroke="#1F1813" stroke-width="1.5"/>
  <rect x="14" y="14" width="692" height="452" fill="none" stroke="#1F1813" stroke-width="0.6" opacity="0.5"/>
</svg>
