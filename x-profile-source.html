<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:400px;height:400px;overflow:hidden;background:#F2EAD8}
  body{
    position:relative;
    display:grid;place-items:center;
  }
  body::before{
    content:""; position:absolute; inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode:multiply; opacity:.45;
    pointer-events:none; z-index:1;
  }
  .stamp{
    width:340px;height:340px;border-radius:50%;
    border:9px solid #8B1A1A;
    display:grid;place-items:center;
    transform:rotate(-12deg);position:relative;z-index:2;
    background:rgba(242,234,216,.5);
  }
  .stamp::before{
    content:"";position:absolute;inset:14px;
    border:3px solid #8B1A1A;border-radius:50%;
  }
  .stamp .inner{
    writing-mode:vertical-rl;text-orientation:upright;
    font-family:'Shippori Mincho B1',serif;
    font-weight:800;font-size:62px;color:#8B1A1A;
    letter-spacing:.34em;
  }
</style></head><body>
  <div class="stamp"><span class="inner">機密</span></div>
</body></html>
