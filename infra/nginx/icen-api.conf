# Drop-in snippet for an existing nginx server { ... } block.
#
# Either:
#   server {
#     ...
#     include snippets/icen-api.conf;
#   }
# or paste the body directly. Adjust the public path as needed.

location /icen/ {
    proxy_pass         http://127.0.0.1:8731/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # CORS pre-flight handling (POST /apply with JSON sends OPTIONS first)
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "https://tama831.github.io" always;
        add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type"        always;
        add_header Access-Control-Max-Age       86400                 always;
        return 204;
    }
}
